# Governance Hard — Protected branch enforcement (thin wrapper)
# Calls the central reusable workflow in aihackers-volym/governance.
#
# IMPORTANT:
# - Do NOT duplicate enforcement logic here
# - Check names are determined by the reusable workflow's job names
# - concurrency is managed here, NOT in the called workflow

name: Governance Hard

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: governance-hard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-hard:
    uses: aihackers-volym/governance/.github/workflows/reusable-governance-hard.yml@ca8a69c27bd0cf8dde244cb259c940c140f9786b
    secrets:
      gpr_read_token: ${{ secrets.GPR_READ_TOKEN }}
