# Governance Fast — Lightweight validation (thin wrapper)
# Calls the central reusable workflow in aihackers-volym/governance.
#
# IMPORTANT:
# - Do NOT duplicate validation logic here
# - concurrency is managed here, NOT in the called workflow

name: Governance Fast

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: governance-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance-fast:
    uses: aihackers-volym/governance/.github/workflows/reusable-governance-fast.yml@d633e337e95382b85608b8f9dcc974fdb50ba2d3
    secrets:
      gpr_read_token: ${{ secrets.GPR_READ_TOKEN }}
