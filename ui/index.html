<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VD-assistent — AI-baserat beslutsstöd" />
  <title>Inkommande — VD-assistent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    
    <!-- Topbar (slimmed down) -->
    <header class="topbar">
      <div class="topbar-logo">VD-assistent</div>
      <div class="topbar-date" id="currentDate"></div>
    </header>

    <main class="main-content">
      <div class="layout-grid">
        
        <!-- Vänster: Inkommande-lista -->
        <section class="email-list-col">
          <div class="section-header">
            <h1>Inkommande</h1>
          </div>
          <div class="email-cards" id="emailCards"></div>
        </section>

        <!-- Höger: Statiskt Kundkort -->
        <aside class="customer-card-col" id="customerCardContainer">
          <div class="customer-card">
            <h2>Om kunden</h2>
            <div class="customer-details" id="customerDetails">
              <!-- Renderas via JS -->
            </div>
          </div>
        </aside>

      </div>
    </main>

    <!-- Overlay Drawer (öppnas vid klick på ärende) -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <aside class="drawer" id="emailDrawer">
      <button class="drawer-close" id="drawerClose">&times;</button>
      <div class="drawer-content" id="drawerContent">
        <!-- Drawer-innehåll renderas här via JS -->
      </div>
    </aside>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
