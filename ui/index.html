<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VD-assistent — AI-baserat beslutsstöd för prioritering, delegering och uppföljning" />
  <title>VD-assistent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">V</span>
          <span class="logo-text">VD-assistent</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="overview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          Överblick
        </a>
        <a href="#" class="nav-item" data-view="incoming">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
          Inkommande
          <span class="nav-badge" id="incomingCount">12</span>
        </a>
        <a href="#" class="nav-item" data-view="delegated">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>
          Delegerat
        </a>
        <a href="#" class="nav-item" data-view="followup">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Uppföljning
        </a>
        <a href="#" class="nav-item" data-view="batching">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
          Batching
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="ai-status">
          <span class="ai-dot"></span>
          <span>AI redo</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-toggle" id="menuToggle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-date" id="currentDate"></div>
        <div class="topbar-actions">
          <div class="ai-indicator">
            <span class="ai-pulse"></span>
            AI
          </div>
        </div>
      </header>

      <div class="content">
        <div class="content-grid">
          <section class="email-list" id="emailList">
            <div class="section-header">
              <h1>Inkommande</h1>
              <div class="filter-tabs">
                <button class="filter-tab active" data-filter="all">Alla</button>
                <button class="filter-tab" data-filter="jonas">Jonas</button>
                <button class="filter-tab" data-filter="delegera">Delegera</button>
                <button class="filter-tab" data-filter="batch">Batch</button>
              </div>
            </div>
            <div class="email-cards" id="emailCards"></div>
          </section>

          <aside class="summary-panel" id="summaryPanel">
            <div class="summary-card">
              <h2>Översikt</h2>
              <div class="summary-stats" id="summaryStats"></div>
            </div>
            <div class="detail-card" id="detailCard">
              <div class="detail-placeholder">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <p>Välj ett mejl för detaljer</p>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
